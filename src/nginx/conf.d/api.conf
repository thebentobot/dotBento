server {
    listen 443 ssl;
    server_name api.bentobot.xyz;
    ssl_certificate /etc/letsencrypt/live/api.bentobot.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bentobot.xyz/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    location = /metrics {
        return 404;
    }
    location / {
        set $backend http://webapi:8080;
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy.conf;
    }
}
