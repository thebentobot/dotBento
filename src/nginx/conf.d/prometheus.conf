server {
    listen 443 ssl;
    server_name prometheus.bentobot.xyz;
    ssl_certificate /etc/letsencrypt/live/prometheus.bentobot.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prometheus.bentobot.xyz/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    location / {
        auth_basic "Protected Prometheus";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        set $backend http://prometheus:9090;
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy.conf;
    }
}
