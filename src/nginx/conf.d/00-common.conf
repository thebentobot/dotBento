# Docker's resolver rechecks service IPs after application container replacement.
# Resolve at request time so an intentionally stopped staging API is allowed.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8088;
    access_log off;
    location = /health {
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.bentobot.xyz sta-api.bentobot.xyz grafana.bentobot.xyz prometheus.bentobot.xyz;

    # HTTP-01 renewals must work even when staging applications are stopped.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
