services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: bento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bento
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d bento"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bento_net

  valkey:
    image: valkey/valkey:9.1.3-alpine
    container_name: bento-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bento_net

  image-renderer:
    image: ghcr.io/thebentobot/bento-image-service:0.1.1
    container_name: bento-image-renderer
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256mb
    pids_limit: 256
    mem_limit: 1g
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - bento_net

volumes:
  # PostgreSQL 18 requires a fresh or migrated volume; PostgreSQL 16 files are incompatible.
  postgres_data:

networks:
  bento_net:
