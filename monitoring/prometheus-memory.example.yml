# Merge these sections into the VPS-managed prometheus.yml; do not replace it.
rule_files:
  - /etc/prometheus/memory-alerts.yml

scrape_configs:
  - job_name: webapi
    static_configs:
      - targets: ['webapi:8080']
        labels:
          environment: production
  - job_name: webapi-sta
    static_configs:
      - targets: ['webapi-sta:8080']
        labels:
          environment: staging
  - job_name: pushgateway
    honor_labels: false # Existing dashboards and rules use exported_job.
    static_configs:
      - targets: ['pushgateway:9091']
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
