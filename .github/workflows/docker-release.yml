name: Docker - Release

env:
  HUSKY: 0

on:
  release:
    types: [published]

concurrency:
  group: bento-vps-deployment
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write

jobs:
  docker-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.release.prerelease == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare deployment helpers
        id: source
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/deployment.py render inspect /tmp/bento-inspect.sh
          python3 .github/scripts/deployment.py render deploy-production /tmp/bento-deploy.sh
          python3 .github/scripts/deployment.py render stop-staging /tmp/bento-stop.sh

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/thebentobot/dotbento
          tags: type=raw,value=${{ github.event.release.tag_name }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.revision }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Build and push bot image
        uses: docker/build-push-action@v7
        with:
          file: src/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thebentobot/dotbento:${{ github.event.release.tag_name }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Web API image
        uses: docker/build-push-action@v7
        with:
          file: src/dotBento.WebApi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thebentobot/dotbento-webapi:${{ github.event.release.tag_name }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_HOST }}

      - name: Deploy production and wait for healthy containers
        uses: appleboy/ssh-action@master
        env:
          DEPLOY_TAG: ${{ github.event.release.tag_name }}
          DEPLOY_REVISION: ${{ steps.source.outputs.revision }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          envs: DEPLOY_TAG,DEPLOY_REVISION
          command_timeout: 15m
          script_path: /tmp/bento-deploy.sh

      - name: Read healthy production and current staging
        id: deployed
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          script_path: /tmp/bento-inspect.sh
          capture_stdout: true

      - name: Check for newer unreleased application changes
        id: plan
        env:
          DEPLOYMENT_STATE: ${{ steps.deployed.outputs.stdout }}
        run: |
          git fetch origin master
          python3 .github/scripts/deployment.py plan-release

      - name: Stop the complete staging stack when production has caught up
        if: steps.plan.outputs.action == 'stop'
        uses: appleboy/ssh-action@master
        env:
          DEPLOYMENT_STATE: ${{ steps.deployed.outputs.stdout }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          envs: DEPLOYMENT_STATE
          script_path: /tmp/bento-stop.sh

      - name: Publish documentation for this release
        env:
          GH_TOKEN: ${{ secrets.BENTO_DOCS_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api --method POST repos/thebentobot/bento-docs/dispatches \
            -f event_type=dotbento_release \
            -f "client_payload[ref]=$RELEASE_TAG"
