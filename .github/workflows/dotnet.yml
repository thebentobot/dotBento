# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build dotBento

env:
  HUSKY: 0

on:
  pull_request:
    branches: ["master"]

jobs:
  proxy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare temporary proxy fixtures
        run: |
          mkdir -p src/letsencrypt/live/api.bentobot.xyz
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout src/letsencrypt/live/api.bentobot.xyz/privkey.pem \
            -out src/letsencrypt/live/api.bentobot.xyz/fullchain.pem 2>/dev/null
          for domain in sta-api.bentobot.xyz grafana.bentobot.xyz prometheus.bentobot.xyz; do
            mkdir -p "src/letsencrypt/live/$domain"
            cp src/letsencrypt/live/api.bentobot.xyz/*.pem "src/letsencrypt/live/$domain/"
          done
          printf 'smoke:' > src/nginx/.htpasswd
          openssl rand -hex 16 | openssl passwd -6 -stdin >> src/nginx/.htpasswd
          touch src/.env-prod src/.env-webapi src/.env-sta src/.env-webapi-sta \
            src/.env-postgres-prod src/.env-postgres-sta
      - name: Validate proxy configuration with applications stopped
        run: |
          sh -n src/nginx/40-watch-certificates.sh src/certbot/renew.sh
          docker compose -f src/docker-compose.prod.yml config --quiet
          docker compose -f src/docker-compose.prod.yml up -d --no-deps --wait --wait-timeout 60 nginx
          docker compose -f src/docker-compose.prod.yml exec -T nginx nginx -t
          for domain in api.bentobot.xyz sta-api.bentobot.xyz; do
            status=$(curl --insecure --silent --show-error --resolve "$domain:443:127.0.0.1" \
              -o /dev/null -w '%{http_code}' "https://$domain/metrics")
            test "$status" = 404
          done
          for domain in grafana.bentobot.xyz prometheus.bentobot.xyz; do
            status=$(curl --insecure --silent --show-error --resolve "$domain:443:127.0.0.1" \
              -o /dev/null -w '%{http_code}' "https://$domain/")
            test "$status" = 401
          done
      - name: Stop proxy smoke test
        if: always()
        run: docker compose -f src/docker-compose.prod.yml down --volumes

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test deployment lifecycle decisions
        run: python3 -m unittest discover -s tests/deployment -v
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402
      - name: Restore dependencies
        run: dotnet restore dotBento.sln
      - name: Build
        run: dotnet build dotBento.sln --configuration Release --no-restore
      - name: Check slash-command documentation manifest
        run: dotnet run --project tools/dotBento.CommandDocs --configuration Release -- check --input docs/slash-commands.json
      - name: Run tests
        run: dotnet test dotBento.sln --configuration Release --no-build --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - src/Dockerfile
          - src/dotBento.WebApi/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
