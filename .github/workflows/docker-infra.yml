name: Docker - Infrastructure

env:
  HUSKY: 0

on:
  push:
    branches: [master]
    paths:
      - src/docker-compose.prod.yml
  workflow_dispatch:

# Share the queue with production; infrastructure and application deployments
# must never write the live Compose file at the same time.
concurrency:
  group: bento-vps-deployment
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  apply-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare deployment helper
        run: |
          python3 .github/scripts/deployment.py \
            render apply-infra /tmp/bento-infra.sh src/docker-compose.prod.yml

      # Only image tags are reconciled. The live file keeps its VPS-specific
      # config, and the bot/API services stay owned by the release workflows.
      - name: Apply infrastructure image updates
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 15m
          script_path: /tmp/bento-infra.sh
