name: Docker - Pre-release

env:
  HUSKY: 0

on:
  push:
    branches: [master]
  workflow_dispatch:

# Share the queue with production; keep pending releases instead of replacing them.
concurrency:
  group: bento-vps-deployment
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  packages: write

jobs:
  github-docker-pre-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare deployment helpers
        run: |
          git fetch origin master
          python3 .github/scripts/deployment.py render inspect /tmp/bento-inspect.sh
          python3 .github/scripts/deployment.py render deploy-staging /tmp/bento-deploy.sh
          python3 .github/scripts/deployment.py render stop-staging /tmp/bento-stop.sh

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_HOST }}

      - name: Read deployed source revisions
        id: deployed
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          script_path: /tmp/bento-inspect.sh
          capture_stdout: true

      - name: Compare master with running production
        id: plan
        env:
          DEPLOYMENT_STATE: ${{ steps.deployed.outputs.stdout }}
        run: python3 .github/scripts/deployment.py plan-staging

      - name: Stop staging when production already contains the application changes
        if: steps.plan.outputs.action == 'stop'
        uses: appleboy/ssh-action@master
        env:
          DEPLOYMENT_STATE: ${{ steps.deployed.outputs.stdout }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          envs: DEPLOYMENT_STATE
          script_path: /tmp/bento-stop.sh

      - name: Create GitHub pre-release
        if: steps.plan.outputs.action == 'deploy'
        uses: ncipollo/release-action@v1.21.0
        with:
          name: Pre-release ${{ steps.plan.outputs.tag }}
          tag: ${{ steps.plan.outputs.tag }}
          commit: ${{ steps.plan.outputs.revision }}
          prerelease: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        if: steps.plan.outputs.action == 'deploy'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/thebentobot/dotbento
          tags: type=raw,value=${{ steps.plan.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ steps.plan.outputs.revision }}

      - name: Set up QEMU
        if: steps.plan.outputs.action == 'deploy'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.plan.outputs.action == 'deploy'
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: steps.plan.outputs.action == 'deploy'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Build and push bot image
        if: steps.plan.outputs.action == 'deploy'
        uses: docker/build-push-action@v7
        with:
          file: src/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thebentobot/dotbento:${{ steps.plan.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Web API image
        if: steps.plan.outputs.action == 'deploy'
        uses: docker/build-push-action@v7
        with:
          file: src/dotBento.WebApi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thebentobot/dotbento-webapi:${{ steps.plan.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Recheck master after building
        id: fresh
        if: steps.plan.outputs.action == 'deploy'
        run: |
          git fetch origin master
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy staging and start its database and cache
        if: steps.plan.outputs.action == 'deploy' && steps.fresh.outputs.current == 'true'
        uses: appleboy/ssh-action@master
        env:
          DEPLOY_TAG: ${{ steps.plan.outputs.tag }}
          DEPLOY_REVISION: ${{ steps.plan.outputs.revision }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          envs: DEPLOY_TAG,DEPLOY_REVISION
          command_timeout: 15m
          script_path: /tmp/bento-deploy.sh
